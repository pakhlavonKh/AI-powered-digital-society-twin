name: workbench

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned API environment
        run: |
          python -m pip install -r requirements-api.lock
          python -m pip install -e . --no-deps
      - name: Tests (artificial fixtures only; sockets to non-loopback hosts are blocked in-process)
        run: python -m pytest -m "not local_fixture and not matraix"

  frontend:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-api.lock
          .venv/bin/pip install -e . --no-deps
          cd frontend && npm ci && npx playwright install --with-deps chromium
      - name: Typed client is current
        run: |
          PYTHONPATH=src .venv/bin/python -m societytwin.api.openapi_export /tmp/openapi.json
          diff -q /tmp/openapi.json frontend/openapi.json
      - name: Typecheck and component tests
        run: cd frontend && npx tsc --noEmit && npx vitest run
      - name: Browser flow (artificial fixture, no runtime, no keys)
        run: ./scripts/e2e.sh
      - name: Client bundle carries no server configuration
        run: ./scripts/check_bundle.sh
